<!doctype html>
<meta charset="utf-8" />
<title>Reproductibilité entre moteurs JavaScript</title>
<pre id="out">prêt</pre>
<script type="module">
  import { runTower } from '../src/sim/engine.js'
  import { randomTeamGenome } from '../src/sim/brain.js'

  // Page de contrôle : la même simulation doit rendre le même bit ici et
  // dans Node. Elle n'est pas servie en production, elle sert à `npm run
  // verifier-moteurs`, qui la charge dans un vrai navigateur et compare.
  function mulberry32(a) {
    return function () {
      a |= 0
      a = (a + 0x6d2b79f5) | 0
      let t = Math.imul(a ^ (a >>> 15), 1 | a)
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }

  window.executer = (graines) => {
    const res = []
    for (const g of graines) {
      const genome = randomTeamGenome(mulberry32(g))
      const r = runTower(genome, g, null, 40, { emitEvents: false })
      res.push({ graine: g, fitness: r.fitness, etages: r.floors, issue: r.reason })
    }
    document.getElementById('out').textContent = JSON.stringify(res, null, 1)
    return res
  }
</script>
